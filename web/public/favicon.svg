<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    El Puente de Boyacá. No un puente cualquiera: el que está sobre el río
    Teatinos, catorce kilómetros al oeste de Tunja.

    Su forma es rara y por eso es reconocible — un solo arco semicircular y
    DOS TABLEROS QUE SE JUNTAN EN ÁNGULO, así que el paso no es una recta sino
    un pico. Un puente genérico de arcos iguales y tablero horizontal no es
    este puente; es cualquiera.

    Trazo y nada más: sin relleno, sin fondo, sin segundo color. A 16 px —el
    tamaño real de una pestaña— cualquier detalle se vuelve un borrón, y lo
    único que sobrevive es la silueta. Los dos trazos verticales de los
    extremos son los estribos, y no sobran: sin ellos el dibujo se lee como el
    techo de una carpa.

    El color lo pone el tema del navegador, no el archivo: tinta sobre claro,
    hueso sobre oscuro. Un favicon SVG puede leer prefers-color-scheme, que es
    lo que evita tener dos archivos y elegir el equivocado.
  -->
  <style>
    :root { color: #1e1813 }
    @media (prefers-color-scheme: dark) { :root { color: #f0e7d8 } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 18 16 11l14 7"/>
    <path d="M8 24a8 8 0 0 1 16 0"/>
    <path d="M2 18v6M30 18v6"/>
  </g>
</svg>
