# Mismo papel que el proxy de Vite en dev: el navegador habla con un solo
# origen y nginx reenvía /v1/* al backend. Así no hay CORS y la API nunca
# se entera de quién hay delante.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real va a index.html,
    # para que React Router maneje el routing del lado del cliente.
    # El catálogo de un plan son ~300 KB de JSON y el bundle otro tanto: sin
    # esto viajaban en claro (medido 2026-09-20). `gzip_proxied any` porque lo
    # que más pesa es justo lo que viene del proxy a la API.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso a la API. El hostname "api" es el nombre del servicio
    # en docker-compose, resuelto por la red interna de Docker.
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las consultas al SIA pueden tardar: sesión nueva + scraping.
        proxy_read_timeout 60s;
    }

    # Cache agresivo para assets con hash (Vite les pone hash en el nombre).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
