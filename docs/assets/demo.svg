<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-label="Terminal: primera llamada 7.95s contra el SIA, segunda 1.2ms desde Postgres">
  <rect x="0" y="0" width="760" height="372" rx="10" fill="#14161c"/>
  <rect x="0" y="0" width="760" height="34" rx="10" fill="#1d2029"/>
  <rect x="0" y="24" width="760" height="10" fill="#1d2029"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="39" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="17" r="5.5" fill="#28c840"/>
  <text x="380" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b93a7">sia-unal-bridge — read-through</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="22" y="64" fill="#59d18b">$</text>
    <text x="40" y="64" fill="#d7dbe6">curl /v1/campuses/1101/faculties</text>

    <text x="40" y="88" fill="#7d8598"># cache frío: cascada ADF de 15 POSTs contra el SIA</text>
    <text x="40" y="110" fill="#d7dbe6">{"faculties":[{"code":"2048","name":"FACULTAD DE AGRONOMÍA"}, …]}</text>
    <text x="40" y="132" fill="#febc2e">7.95 s</text>

    <text x="22" y="166" fill="#59d18b">$</text>
    <text x="40" y="166" fill="#d7dbe6">curl /v1/campuses/1101/faculties</text>

    <text x="40" y="190" fill="#7d8598"># mismo dato, ahora desde Postgres</text>
    <text x="40" y="212" fill="#d7dbe6">{"faculties":[{"code":"2048","name":"FACULTAD DE AGRONOMÍA"}, …]}</text>
    <text x="40" y="234" fill="#59d18b">0.0012 s</text>

    <line x1="22" y1="258" x2="738" y2="258" stroke="#2a2e3a" stroke-width="1"/>

    <text x="22" y="286" fill="#59d18b">$</text>
    <text x="40" y="286" fill="#d7dbe6">curl -i .../programs/2A74/courses/1000003-B/sections/1/seats</text>
    <text x="40" y="310" fill="#d7dbe6">Cache-Control: max-age=300 · X-Cache: hit · Age: 5</text>
    <text x="40" y="332" fill="#d7dbe6">{"available":40,"measured_at":"2026-08-16T02:57:57Z","age_seconds":5}</text>
    <text x="40" y="354" fill="#7d8598"># nunca se sirve un cupo sin decir de cuándo es</text>
  </g>
