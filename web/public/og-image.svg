<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Tarjeta de vista previa (og:image). Mismos tokens que web/src/styles/tokens.css
    tema claro — no se regenera desde ahí porque esto se rasteriza a PNG en build
    time, pero si los colores cambian allá, cámbialos acá también.
  -->
  <rect width="1200" height="630" fill="#f6f2ea"/>

  <!-- El Puente de Boyacá: mismo path que web/public/favicon.svg y
       web/src/components/Topbar.tsx, escalado ×8 desde el viewBox 32×32
       original (no redibujado a mano, para no perder la silueta real). -->
  <g transform="translate(105 60)" fill="none" stroke="#1e1813" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 144 128 88l112 56"/>
    <path d="M64 192a64 64 0 0 1 128 0"/>
    <path d="M16 144v48M240 144v48"/>
  </g>

  <!-- Instrument Serif recta, no cursiva: la itálica en este proyecto solo
       vive dentro de un <em>, y el logotipo (Topbar.css .brand__word) es
       peso 400 derecho. -->
  <text x="120" y="430" font-family="Instrument Serif, Georgia, serif" font-size="108" fill="#1e1813">SIA Bridge</text>

  <text x="122" y="478" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="30" fill="#5f5346">Catálogo de asignaturas de la Universidad Nacional de Colombia</text>

  <text x="122" y="520" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="30" fill="#5f5346">con la hora exacta en que se consultaron los cupos.</text>

  <rect x="122" y="548" width="64" height="6" rx="3" fill="#1a6b5a"/>
</svg>
