name: commitlint

on:
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # la action lista los commits del PR vía API, sin esto tira "Resource not accessible by integration"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
