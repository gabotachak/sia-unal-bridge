services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sia
      POSTGRES_PASSWORD: sia
      POSTGRES_DB: sia_bridge
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sia"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
