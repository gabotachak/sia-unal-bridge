# Variante de nginx.conf para el scope de test (servicio `web-test`): mismo
# front, pero /v1/ va a la API de PRODUCCIÓN por su dominio público en vez del
# hostname interno `api` de compose. No hay servicio `api` local que resolver.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso a la API de prod, saliendo por HTTPS como cualquier otro
    # cliente. Host explícito: Caddy del otro lado enruta por ese header, no
    # por a qué IP le pegaste.
    location /v1/ {
        proxy_pass https://sia-api.gabotachak.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host sia-api.gabotachak.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
