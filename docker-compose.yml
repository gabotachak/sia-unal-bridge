services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sia}
      POSTGRES_DB: ${POSTGRES_DB:-sia_bridge}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sia}"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      # Hostname `db` es el nombre del servicio en la red interna de Docker,
      # NO localhost. El DATABASE_URL del .env (sección 4) es para el host.
      DATABASE_URL: postgres://${POSTGRES_USER:-sia}:${POSTGRES_PASSWORD:-sia}@db:5432/${POSTGRES_DB:-sia_bridge}?sslmode=disable
      PORT: ${API_PORT:-8080}
      SIA_BASE_URL: ${SIA_BASE_URL:-https://sia.unal.edu.co/Catalogo/facespublico/public/servicioPublico.jsf}
      SIA_POOL_SIZE: ${SIA_POOL_SIZE:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIA_TERM: ${SIA_TERM:-2026-2}
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports: ["${WEB_PORT:-3000}:80"]
    depends_on:
      - api

volumes:
  pgdata:
