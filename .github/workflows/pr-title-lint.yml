name: pr-title-lint

# El merge por squash usa el título del PR como mensaje final en main —
# semantic-release lo lee a él, no a los commits individuales, en ese caso.
# Ver docs/COMMIT-CONVENTION.md.
on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main]

permissions:
  pull-requests: read

jobs:
  pr-title-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
            style
