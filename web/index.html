<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIA Bridge</title>
    <meta
      name="description"
      content="Catálogo de asignaturas de la Universidad Nacional de Colombia. Cupos con su edad, siempre."
    />

    <!-- La barra del navegador acompaña al tema en vez de quedarse blanca. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f2ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14110d" />

    <!--
      El tema, antes de pintar.

      Va acá y no en React a propósito: React monta después del primer pintado,
      así que leer localStorage allá significaría un fogonazo blanco antes de
      que se aplique el modo oscuro. Este script corre síncrono, con el <body>
      todavía sin pintar, y por eso nadie ve el salto.

      Escribe el atributo SOLO si hay elección explícita: sin atributo manda
      prefers-color-scheme, que es lo que significa "seguir al sistema".
    -->
    <script>
      try {
        var t = localStorage.getItem('tablero.tema.v1');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      El icono es un archivo y no un data URI incrustado acá: adentro lleva una
      media query que lo pinta claro u oscuro según el navegador, y eso no cabe
      en una sola línea escapada. Ver web/public/favicon.svg.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- React se engancha acá. Todo lo demás lo pinta src/main.tsx. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
