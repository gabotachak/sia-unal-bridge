services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sia}
      POSTGRES_DB: ${POSTGRES_DB:-sia_bridge}
    # Atado a 127.0.0.1: sin el prefijo, Docker abre el puerto en TODAS las
    # interfaces y se salta el firewall del host por sus reglas en iptables.
    ports: ["127.0.0.1:${DB_PORT:-15432}:5432"]
    restart: unless-stopped
    # Bind mount, no volumen nombrado: así los datos no caen en /var/lib/docker
    # (SSD del sistema). Sin default a propósito — la ruta es de cada máquina.
    volumes:
      - ${PGDATA_DIR:?falta PGDATA_DIR en .env}:/var/lib/postgresql
      # Crea sia_bridge_test en el PRIMER arranque. Los tests de integración
      # escriben de verdad, y compartir base con producción significó 28 planes
      # falsos dentro de ella (ver el propio script).
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sia}"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      # Sin GIT_TAG/GIT_SHA en el ambiente (build local a mano), el Dockerfile
      # cae a "dev"/"unknown" — nunca una versión inventada.
      args:
        GIT_TAG: ${GIT_TAG:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      # Hostname `db` es el nombre del servicio en la red interna de Docker,
      # NO localhost. El DATABASE_URL del .env (sección 4) es para el host.
      #
      # `pool_max_conns` explícito porque el default de pgx es max(4, NumCPU):
      # en un VPS de 2 vCPU son CUATRO conexiones de base para SIA_POOL_SIZE
      # workers haciendo write-behind. No es incorrecto —el trabajo de DB son
      # ms contra los ~8 s del SIA, así que se serializa y ya— pero deja el
      # tamaño del pool de Postgres atado al hardware en vez de a la carga.
      # 16 sobra para 32 workers y cabe de lejos en el max_connections=100 por
      # defecto de Postgres.
      DATABASE_URL: postgres://${POSTGRES_USER:-sia}:${POSTGRES_PASSWORD:-sia}@db:5432/${POSTGRES_DB:-sia_bridge}?sslmode=disable&pool_max_conns=16
      PORT: 8080
      SIA_BASE_URL: ${SIA_BASE_URL:-https://sia.unal.edu.co/Catalogo/facespublico/public/servicioPublico.jsf}
      SIA_POOL_SIZE: ${SIA_POOL_SIZE:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIA_TERM: ${SIA_TERM:-2026-2}
      FETCH_COOLDOWN: ${FETCH_COOLDOWN:-300}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      SIA_ACQUIRE_TIMEOUT_SECONDS: ${SIA_ACQUIRE_TIMEOUT_SECONDS:-45}
      # Para que los logs cuadren con el reloj del host y con el cron. Necesita
      # tzdata en la imagen (ver Dockerfile), o Go se queda en UTC en silencio.
      TZ: ${TZ:-America/Bogota}
    # PORT es fijo dentro del contenedor; API_PORT sólo mueve el puerto del host.
    # Atado a 127.0.0.1 igual que db (ver su comentario): sin el prefijo,
    # cualquiera se salta Caddy pegándole directo al contenedor, incluido para
    # falsificar X-Forwarded-For y evadir el rate limit por IP.
    ports: ["127.0.0.1:${API_PORT:-18080}:8080"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # El Job de fase 2. Misma imagen que `api`, otro entrypoint, y `restart: no`
  # porque termina a propósito: una corrida, un modo, y sale.
  #
  # Está bajo el perfil `jobs`, así que `docker compose up -d` NO lo arranca.
  # Sin eso, levantar el stack dispararía un barrido, y `restart: unless-stopped`
  # lo repetiría en bucle. Se invoca desde cron (ver deploy/cron.d/sia-refresher):
  #
  #   docker compose run --rm refresher --mode=catalog --workers=2
  refresher:
    build:
      context: .
      args:
        GIT_TAG: ${GIT_TAG:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    profiles: ["jobs"]
    entrypoint: ["refresher"]
    # Sin --mode no hace nada y sale con 2: la corrida siempre elige uno.
    command: ["--mode=reference"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sia}:${POSTGRES_PASSWORD:-sia}@db:5432/${POSTGRES_DB:-sia_bridge}?sslmode=disable
      SIA_BASE_URL: ${SIA_BASE_URL:-https://sia.unal.edu.co/Catalogo/facespublico/public/servicioPublico.jsf}
      # El pool de la API, sólo para que el job pueda avisar si la suma pasa
      # de 80 conexiones — el techo medido (docs/OPEN-QUESTIONS.md §5). No lo comparte.
      SIA_POOL_SIZE: ${SIA_POOL_SIZE:-4}
      SIA_TERM: ${SIA_TERM:-2026-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REFRESH_ENABLED: ${REFRESH_ENABLED:-true}
      REFRESH_WORKERS: ${REFRESH_WORKERS:-2}
      REFRESH_POOL_SIZE: ${REFRESH_POOL_SIZE:-2}
      REFRESH_MAX_DURATION: ${REFRESH_MAX_DURATION:-4h}
      REFRESH_RATE_POSTS_PER_SEC: ${REFRESH_RATE_POSTS_PER_SEC:-6}
      REFRESH_CATALOG_MAX_AGE: ${REFRESH_CATALOG_MAX_AGE:-168h}
      REFRESH_DETAIL_MAX_AGE: ${REFRESH_DETAIL_MAX_AGE:-24h}
      REFRESH_HOT_SET_SIZE: ${REFRESH_HOT_SET_SIZE:-250}
      # cron no hereda la TZ del host y una hora corrida mete el barrido
      # pesado en horario pico. Necesita tzdata en la imagen (ver Dockerfile).
      TZ: ${TZ:-America/Bogota}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      # El front necesita el mismo cooldown que la API para no ofrecer un botón
      # que el backend va a rechazar con 429.
      args:
        FETCH_COOLDOWN: ${FETCH_COOLDOWN:-300}
        # Apaga el banner de incidencia del front. Se hornea en el bundle, así
        # que cambiarlo pide `docker compose build web`, no un restart.
        VITE_INCIDENT_BANNER_OFF: ${VITE_INCIDENT_BANNER_OFF:-}
        # Mismo camino que FETCH_COOLDOWN: .env de la raíz, build arg acá,
        # ARG/ENV en el Dockerfile, `define` en vite.config.ts. Sin este
        # eslabón el bundle de Docker caía al '7200' de vite.config.ts aunque
        # .env.example diga 1800 (docs/PLAN-SIACHANGES.md A4).
        VITE_STALE_SEATS_SECONDS: ${VITE_STALE_SEATS_SECONDS:-1800}
        GIT_TAG: ${GIT_TAG:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    # Atado a 127.0.0.1: mismo motivo que api arriba.
    ports: ["127.0.0.1:${WEB_PORT:-13000}:8080"]
    restart: unless-stopped
    depends_on:
      - api

  # Scope de test: mismo bundle que `web`, apuntando a la API de PRODUCCIÓN
  # (nginx.test.conf) en vez del contenedor `api` local. Sin `depends_on: api`
  # a propósito — no necesita ni db ni api de este stack para funcionar.
  web-test:
    build:
      context: ./web
      args:
        FETCH_COOLDOWN: ${FETCH_COOLDOWN:-300}
        VITE_INCIDENT_BANNER_OFF: ${VITE_INCIDENT_BANNER_OFF:-}
        VITE_STALE_SEATS_SECONDS: ${VITE_STALE_SEATS_SECONDS:-1800}
        GIT_TAG: ${GIT_TAG:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    volumes:
      - ./web/nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:${WEB_TEST_PORT:-23000}:8080"]
    restart: unless-stopped
